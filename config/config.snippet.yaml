# Fragment for ~/.hermes/config.yaml (merge it by hand; do not replace the file).

plugins:
  enabled:
    - dlc

memory:
  provider: honcho          # self-hosted, see infra/honcho

kanban:
  dispatch_in_gateway: true
  dispatch_interval_seconds: 30
  failure_limit: 2
  max_in_progress: 4
  max_in_progress_per_profile: 1
  review_dispatch: true

delegation:
  max_concurrent_children: 4
  max_spawn_depth: 1

skills:
  write_approval: false     # true = agent edits to skills go through /skills approve

# The DLC's own env vars (~/.hermes/.env):
#   DLC_EMBED_URL=http://localhost:11434/v1
#   DLC_EMBED_MODEL=embeddinggemma
#   DLC_REUSE_AT=0.78        # agent match threshold for reuse
#   DLC_ADAPT_AT=0.60        # threshold for adapt (narrow inheritor)
#   DLC_PROFILE_PREFIX=ag-   # prefix of library profiles
